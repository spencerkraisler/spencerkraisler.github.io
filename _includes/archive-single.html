{% include base_path %}

<a class="post-row" href="{{ base_path }}{{ post.url }}" rel="permalink" data-tags="{{ post.tags | join: ',' }}">
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time>
  <div class="post-row__body">
    <span class="post-row__title">{{ post.title | markdownify | remove: "<p>" | remove: "</p>" }}</span>
    {% if post.excerpt %}<p class="post-row__excerpt">{{ post.excerpt | strip_html | strip }}</p>{% endif %}
    {% if post.tags.size > 0 %}
      <span class="post-row__tags">{% for tag in post.tags %}<span class="tag-chip">{{ tag }}</span>{% endfor %}</span>
    {% endif %}
  </div>
</a>
